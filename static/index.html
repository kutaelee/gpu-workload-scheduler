<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPU Workload Queue</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0e14;--card:#121923;--line:#263244;--muted:#92a1b5;--ok:#65d6ad;--warn:#ffd166;--bad:#ff6b6b}
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:#edf4fc}
    main{max-width:1240px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px}
    h1{margin:0;font-size:26px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.value{font-size:22px;font-weight:700;margin-top:4px}
    .ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}#error{white-space:pre-wrap;word-break:break-word}
    section{margin-top:22px}h2{font-size:16px}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
    th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}.empty{color:var(--muted)}
    @media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.top{display:block}table{display:block;overflow:auto}}
  </style>
</head>
<body><main>
  <div class="top"><div><h1>GPU Workload Queue</h1><div class="muted">RTX 5090 예약 · health gate · 고부하 cooldown</div></div><div id="updated" class="muted"></div></div>
  <div class="grid">
    <div class="card"><div class="muted">GPU Health</div><div id="health" class="value">—</div></div>
    <div class="card"><div class="muted">VRAM</div><div id="vram" class="value">—</div></div>
    <div class="card"><div class="muted">사용률 · 온도</div><div id="util" class="value">—</div></div>
    <div class="card"><div class="muted">전력 · PCIe</div><div id="power" class="value">—</div></div>
    <div class="card"><div class="muted">실행 / 대기</div><div id="counts" class="value">—</div></div>
  </div>
  <div class="card"><div class="muted">스케줄러 판단</div><div id="decision" style="margin-top:6px">—</div><div id="error" class="bad" style="margin-top:6px"></div></div>
  <section><h2>실행 중</h2><div id="active"></div></section>
  <section><h2>대기열</h2><div id="queued"></div></section>
  <section><h2>최근 완료</h2><div id="completed"></div></section>
</main><script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function table(rows){if(!rows.length)return '<div class="empty">작업 없음</div>';return `<table><thead><tr><th>ID</th><th>에이전트</th><th>워크로드</th><th>상태</th><th>VRAM</th><th>예상</th><th>우선순위</th></tr></thead><tbody>${rows.map(x=>`<tr><td title="${esc(x.id)}">${esc(x.id.slice(0,8))}</td><td>${esc(x.agent_name)}</td><td>${esc(x.workload_key)}</td><td>${esc(x.status)}</td><td>${esc(x.requested_vram_mb)} MiB</td><td>${esc(x.estimated_seconds)}s</td><td>${esc(x.effective_score??x.priority)}</td></tr>`).join("")}</tbody></table>`}
async function refresh(){try{
  const r=await fetch("/api/status",{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);
  const d=await r.json(),rt=d.runtime,g=rt.gpu,j=d.jobs,h=rt.gpu_health||{status:"unknown"};
  const health=document.querySelector("#health");health.textContent=String(h.status||"unknown").toUpperCase();health.className=`value ${h.status==="healthy"?"ok":h.status==="recovering"?"warn":"bad"}`;
  document.querySelector("#vram").textContent=g?`${g.used_mb.toLocaleString()} / ${g.total_mb.toLocaleString()} MiB`:"차단됨";
  document.querySelector("#util").textContent=g?`${g.utilization_percent}% · ${g.temperature_c??"?"}°C`:"—";
  document.querySelector("#power").textContent=g?`${g.power_draw_w?.toFixed?.(0)??g.power_draw_w??"?"}W · Gen${g.pcie_generation??"?"} x${g.pcie_width??"?"}`:"—";
  document.querySelector("#counts").textContent=`${j.active.length} / ${j.queued.length}`;
  document.querySelector("#decision").textContent=rt.last_decision;
  document.querySelector("#error").textContent=rt.last_error||"";
  document.querySelector("#active").innerHTML=table(j.active);document.querySelector("#queued").innerHTML=table(j.queued);document.querySelector("#completed").innerHTML=table(j.completed);
  document.querySelector("#updated").textContent=new Date().toLocaleTimeString()+" 갱신";
}catch(e){document.querySelector("#decision").textContent="연결 실패: "+e.message}}
refresh();setInterval(refresh,3000);
</script></body></html>
